name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: SHA de una imagen publicada; vacío vuelve a desplegar el commit actual
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias de prueba
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ejecutar tests y medir cobertura
        working-directory: backend
        run: >-
          python -m pytest
          --cov=app
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
      - name: Aplicar umbrales de cobertura
        working-directory: backend
        run: python scripts/check_coverage.py coverage.json --lines 90 --branches 85
      - name: Publicar cobertura del backend
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-backend
          path: |
            backend/coverage.json
            backend/coverage.xml
            backend/htmlcov
      - uses: docker/setup-buildx-action@v4
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/franco2355/ingsoft3-tp01-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias de prueba
        working-directory: frontend
        run: npm ci
      - name: Ejecutar tests, medir cobertura y aplicar umbrales
        working-directory: frontend
        run: npm run test:coverage
      - name: Publicar cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-frontend
          path: |
            frontend/coverage
      - uses: docker/setup-buildx-action@v4
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/franco2355/ingsoft3-tp01-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    name: Desplegar QA
    needs: [build-backend, build-frontend]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    environment:
      name: qa
      url: http://localhost:3100
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
      APP_USER: ${{ secrets.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Descargar imágenes verificadas
        run: docker compose -f compose.qa.yml pull
      - name: Levantar QA
        run: docker compose -f compose.qa.yml up -d --remove-orphans
      - name: Smoke test de QA
        env:
          URL_API: http://localhost:8000
          URL_FRONT: http://localhost:3100
        run: scripts/smoke-test.sh

  deploy-production:
    name: Desplegar PROD
    needs: deploy-qa
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    environment:
      name: production
      url: http://localhost:3001
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
      APP_USER: ${{ secrets.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Descargar imágenes verificadas
        run: docker compose -f compose.prod.yml pull
      - name: Levantar PROD
        run: docker compose -f compose.prod.yml up -d --remove-orphans
      - name: Smoke test de PROD
        env:
          URL_API: http://localhost:8001
          URL_FRONT: http://localhost:3001
        run: scripts/smoke-test.sh
