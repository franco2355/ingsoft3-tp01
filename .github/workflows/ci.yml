name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build-${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: backend
            image: python:3.12-slim
            test: pip install -r requirements-dev.txt && python -m pytest && python scripts/check_coverage.py
          - app: frontend
            image: node:22-alpine
            test: npm ci && npm test
    env:
      IMAGEN: ghcr.io/franco2355/ingsoft3-tp01-${{ matrix.app }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - run: docker run --rm -v "$PWD/${{ matrix.app }}:/app" -w /app ${{ matrix.image }} sh -c "${{ matrix.test }}"
      - if: always()
        run: |
          { echo '```'; cat ${{ matrix.app }}/coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage
      - run: docker build -t "$IMAGEN" ${{ matrix.app }}
      - name: Entrar al registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Publicar la imagen
        if: github.event_name == 'push'
        run: docker push "$IMAGEN"

  deploy-qa:
    needs: build
    if: github.event_name == 'push'
    runs-on: self-hosted
    environment: qa
    env:
      COMPOSE_PROJECT_NAME: expedientes-qa
      COMPOSE_FILE: compose.deploy.yml
      PUERTO: 3100
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_USER: ${{ secrets.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up -d
      - run: docker compose images
      - run: scripts/smoke-test.sh "http://localhost:$PUERTO"

  deploy-production:
    needs: deploy-qa
    runs-on: self-hosted
    environment: production
    env:
      COMPOSE_PROJECT_NAME: expedientes-prod
      COMPOSE_FILE: compose.deploy.yml
      PUERTO: 3001
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_USER: ${{ secrets.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up -d
      - run: docker compose images
      - run: scripts/smoke-test.sh "http://localhost:$PUERTO"
