name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias de prueba
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ejecutar tests y medir cobertura
        working-directory: backend
        run: >-
          python -m pytest
          --cov=app
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
      - name: Aplicar umbrales de cobertura
        working-directory: backend
        run: python scripts/check_coverage.py coverage.json --lines 90 --branches 85
      - name: Publicar cobertura del backend
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-backend
          path: |
            backend/coverage.json
            backend/coverage.xml
            backend/htmlcov
      - uses: docker/setup-buildx-action@v4
      - name: Construir imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias de prueba
        working-directory: frontend
        run: npm ci
      - name: Ejecutar tests, medir cobertura y aplicar umbrales
        working-directory: frontend
        run: npm run test:coverage
      - name: Publicar cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-frontend
          path: |
            frontend/coverage
      - uses: docker/setup-buildx-action@v4
      - name: Construir imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
