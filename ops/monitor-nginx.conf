# Publicar solamente la salud de PROD. El resto de la aplicación conserva su túnel.
server {
    listen 80;
    server_name 209.126.4.187;

    location = /healthz {
        proxy_pass http://127.0.0.1:3001/healthz;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
