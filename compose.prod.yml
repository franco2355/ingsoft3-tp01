name: expedientes-prod

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Definir DB_NAME}
      MYSQL_USER: ${DB_USER:?Definir DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: ghcr.io/franco2355/ingsoft3-tp01-backend:${IMAGE_TAG:?Definir IMAGE_TAG}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_USER: ${APP_USER:?Definir APP_USER}
      APP_PASSWORD: ${APP_PASSWORD:?Definir APP_PASSWORD}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    image: ghcr.io/franco2355/ingsoft3-tp01-frontend:${IMAGE_TAG:?Definir IMAGE_TAG}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data_prod:
